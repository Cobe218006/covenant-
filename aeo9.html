<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>AEO 9 — AI SEO Academy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230A0A0A' stroke='%23D4AF37' stroke-width='3'/><text x='50' y='63' font-size='40' fill='%23D4AF37' text-anchor='middle' font-family='serif'>9</text></svg>">
<style>
:root{
  --obsidian:#0A0A0A; --obsidian-50:#111; --obsidian-100:#161616; --obsidian-150:#1c1c1c;
  --gold:#D4AF37; --gold-dim:#8a7028; --gold-bright:#f0d060;
  --text:#e8e8e8; --text-dim:#a0a0a0; --text-mute:#6a6a6a;
  --line:#232323; --line-soft:#1a1a1a;
  --green:#4ade80; --green-bg:#0f2a1a; --green-line:#1e4a2d;
  --amber:#fbbf24; --amber-bg:#2a1f0a; --amber-line:#4a3512;
  --red:#f87171; --red-bg:#2a0f0f; --red-line:#4a1e1e;
  --blue:#60a5fa; --blue-bg:#0f1a2a; --blue-line:#1e2d4a;
  --purple:#c084fc; --purple-bg:#1a0f2a; --purple-line:#2d1e4a;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--obsidian); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:var(--obsidian-50);border:1px solid var(--line);padding:10px 12px;border-radius:6px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold-dim)}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
#app{display:flex;min-height:100vh;flex-direction:column}
.shell{display:flex;flex:1;max-width:1200px;margin:0 auto;width:100%}
.sidebar{
  width:230px;flex-shrink:0;border-right:1px solid var(--line);
  padding:24px 16px;display:none;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{flex:1;padding:24px 20px calc(90px + var(--safe-bottom)) 20px;min-width:0}
@media(min-width:900px){
  .sidebar{display:flex}
  .main{padding:40px 40px 40px 40px}
  .bottom-nav{display:none!important}
}

/* Brand */
.brand{cursor:pointer;user-select:none;padding:4px 8px;margin-bottom:16px}
.brand-sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-mute)}
.brand-name{font-size:22px;font-weight:300;color:var(--gold);letter-spacing:.02em;margin-top:4px}
.brand-tag{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--text-mute);margin-top:2px}

/* Nav */
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;
  font-size:13.5px;color:var(--text-dim);transition:all .15s;cursor:pointer;
}
.nav-item:hover{background:var(--obsidian-50);color:var(--text)}
.nav-item.active{background:rgba(212,175,55,.09);color:var(--gold)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex-shrink:0}
.nav-item.active .nav-dot{background:var(--gold)}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:rgba(10,10,10,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);z-index:50;
  padding-bottom:var(--safe-bottom);
}
.bottom-nav .nav-item{
  flex:1;flex-direction:column;gap:4px;padding:10px 4px;border-radius:0;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;text-align:center;
}
.bottom-nav .nav-dot{width:5px;height:5px}

/* Typography */
h1{font-size:26px;font-weight:300;letter-spacing:-.01em;line-height:1.2}
h2{font-size:18px;font-weight:400;letter-spacing:-.005em}
h3{font-size:15px;font-weight:500}
.sub{color:var(--text-mute);font-size:13px;margin-top:4px}
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mute)}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 18px;border-radius:999px;font-size:13.5px;
  border:1px solid var(--line);background:var(--obsidian-50);color:var(--text);
  transition:all .15s;cursor:pointer;
}
.btn:hover{border-color:var(--line-soft);background:var(--obsidian-100)}
.btn-primary{
  background:rgba(212,175,55,.1);border-color:var(--gold-dim);color:var(--gold);
}
.btn-primary:hover{background:rgba(212,175,55,.18);border-color:var(--gold)}
.btn-danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-lg{padding:14px 28px;font-size:15px}

/* Cards */
.card{
  background:var(--obsidian-50);border:1px solid var(--line);
  border-radius:8px;padding:16px;
}
.card-link{cursor:pointer;transition:border-color .15s}
.card-link:hover{border-color:var(--gold-dim)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:1fr}
.grid-3{grid-template-columns:1fr}
@media(min-width:640px){
  .grid-2{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:repeat(3,1fr)}
}

/* Stat */
.stat{padding:16px;background:var(--obsidian-50);border:1px solid var(--line);border-radius:8px}
.stat-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-mute)}
.stat-value{font-size:24px;font-weight:300;color:var(--gold);margin-top:6px}
.stat-sub{font-size:11px;color:var(--text-mute);margin-top:2px}

/* Progress */
.progress{height:3px;background:var(--obsidian-100);border-radius:2px;overflow:hidden;margin-top:12px}
.progress-bar{height:100%;background:var(--gold);transition:width .3s}

/* Evidence tags */
.tag{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid;white-space:nowrap;
}
.tag-VERIFIED{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.tag-OBSERVED{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.tag-INFERRED{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.tag-HYPOTHESIS{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-line)}
.tag-UNKNOWN{background:var(--obsidian-100);color:var(--text-mute);border-color:var(--line)}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(4px);
}
.modal{
  background:var(--obsidian-50);border:1px solid var(--line);border-radius:10px;
  padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;
}

/* Auth */
.auth-wrap{max-width:400px;margin:0 auto;padding:60px 24px}

/* Voice */
.call-status{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px;margin-bottom:18px;text-transform:uppercase;
  letter-spacing:.2em;font-size:11px;color:var(--text-dim);
}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--text-mute)}
.pulse.listening{background:var(--green);animation:pulse 1.4s infinite}
.pulse.speaking{background:var(--gold);animation:pulse 1s infinite}
.pulse.thinking{background:var(--amber);animation:pulse .8s infinite}
.pulse.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

.transcript{
  border:1px solid var(--line);border-radius:8px;background:var(--obsidian-50);
  max-height:44vh;overflow-y:auto;padding:16px;margin-bottom:18px;
}
.turn{margin-bottom:12px;font-size:14px;line-height:1.5}
.turn-who{font-weight:500;margin-right:6px}
.turn.learner .turn-who{color:var(--green)}
.turn.buyer .turn-who{color:var(--gold)}

/* Score bars */
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.score-label{width:120px;font-size:12px;color:var(--text-dim);flex-shrink:0}
.score-bar{flex:1;height:5px;background:var(--obsidian-100);border-radius:3px;overflow:hidden}
.score-fill{height:100%;background:var(--gold);transition:width .6s}
.score-val{width:30px;text-align:right;font-size:12px;color:var(--gold)}

/* List */
.list{display:flex;flex-direction:column;gap:8px}
.list-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--obsidian-50);border:1px solid var(--line);border-radius:6px;
  font-size:14px;cursor:pointer;transition:border-color .15s;
}
.list-item:hover{border-color:var(--gold-dim)}
.lesson-check{
  width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.lesson-check.done{background:var(--gold);border-color:var(--gold)}
.lesson-check.done::after{content:"✓";color:var(--obsidian);font-size:11px;font-weight:700}

/* Alert */
.alert{padding:12px 16px;border-radius:6px;font-size:13px;border:1px solid;margin-bottom:16px}
.alert-info{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.alert-warn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.alert-danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.alert-gold{background:rgba(212,175,55,.08);border-color:var(--gold-dim);color:var(--gold)}

/* Empty */
.empty{
  padding:40px 20px;text-align:center;color:var(--text-mute);
  font-size:13px;border:1px dashed var(--line);border-radius:8px;
}

/* Toast */
#toast{
  position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--obsidian-100);border:1px solid var(--gold-dim);
  color:var(--gold);padding:10px 20px;border-radius:999px;
  font-size:13px;z-index:200;transition:all .25s;pointer-events:none;
  max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Choice */
.choice{
  display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:6px;cursor:pointer;transition:all .15s;margin-bottom:8px;
  font-size:14px;line-height:1.4;
}
.choice:hover{border-color:var(--gold-dim)}
.choice.selected{border-color:var(--gold);background:rgba(212,175,55,.05)}
.choice input{width:auto;margin:2px 0 0 0;flex-shrink:0;accent-color:var(--gold)}

/* Field */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px}

/* Bullet list */
.bullets{list-style:none;font-size:14px;line-height:1.6}
.bullets li{padding-left:16px;position:relative;margin-bottom:6px;color:var(--text-dim)}
.bullets li::before{content:"·";position:absolute;left:4px;color:var(--gold)}
</style>

<body>

<div id="app"></div>
<div id="toast"></div>

<script>
/* ═════════════════════════════════════════════════════════════════
   AEO 9 — Single-File Application
   Corporate Curators · Curating Careers Since 2026
   ─────────────────────────────────────────────────────────────────
   Everything runs in the browser. Data persists in localStorage.
   Voice uses the Web Speech API (built into most browsers).
   Credentials use real SHA-256 via Web Crypto.
   No fake data. No fabricated results. Every claim carries a status.
   ═══════════════════════════════════════════════════════════════ */

/* ─── Store ──────────────────────────────────────────────────── */
const Store = {
  KEY: 'aeo9.v1',
  data: null,

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.data = raw ? JSON.parse(raw) : this.blank();
    } catch { this.data = this.blank(); }
    return this.data;
  },

  blank() {
    return {
      users: [],              // { id, name, email, passwordHash, role, createdAt }
      session: null,          // { userId }
      progress: {},           // { userId: { lessonId: true } }
      attempts: {},           // { userId: [ { id, assessmentSlug, score, passed, submittedAt, responses } ] }
      credentials: [],        // { id, userId, level, title, issuedAt, payload, digestSha256, verifyToken, status, evidence }
      voiceSessions: [],      // { id, userId, scenario, persona, difficulty, turns:[], startedAt, endedAt, score }
      evidence: {},           // { userId: [ { id, claim, sourceUrl, sourceDate, status, confidence, notes, createdAt } ] }
      prospects: {},          // { userId: [ { id, companyName, domain, findings:[], createdAt } ] }
      usage: {},              // { userId: [ { kind, seconds, at } ] }
      budget: { dailyVoiceSeconds: 900, hardStop: true },
    };
  },

  save() { localStorage.setItem(this.KEY, JSON.stringify(this.data)); },
  reset() { localStorage.removeItem(this.KEY); this.data = null; this.load(); },

  // helpers
  uid() { return Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-4); },
  user() { return this.data.session ? this.data.users.find(u => u.id === this.data.session.userId) : null; },
  progress(userId) { return this.data.progress[userId] || (this.data.progress[userId] = {}); },
  evidence(userId) { return this.data.evidence[userId] || (this.data.evidence[userId] = []); },
  prospects(userId) { return this.data.prospects[userId] || (this.data.prospects[userId] = []); },
  attempts(userId) { return this.data.attempts[userId] || (this.data.attempts[userId] = []); },
  usage(userId) { return this.data.usage[userId] || (this.data.usage[userId] = []); },
};

/* ─── Crypto (real SHA-256 via Web Crypto) ───────────────────── */
const Crypto = {
  async hashPassword(password) {
    const enc = new TextEncoder().encode(password + '::aeo9.salt.v1');
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return this.hex(buf);
  },

  async sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return this.hex(buf);
  },

  hex(buffer) {
    return [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, '0')).join('');
  },

  // Deterministic JSON canonicalization (sorted keys, no whitespace)
  canonicalize(obj) {
    if (obj === null || typeof obj !== 'object') return JSON.stringify(obj);
    if (Array.isArray(obj)) return '[' + obj.map(o => this.canonicalize(o)).join(',') + ']';
    const keys = Object.keys(obj).filter(k => obj[k] !== undefined).sort();
    return '{' + keys.map(k => JSON.stringify(k) + ':' + this.canonicalize(obj[k])).join(',') + '}';
  },

  randomToken(bytes = 16) {
    const arr = new Uint8Array(bytes);
    crypto.getRandomValues(arr);
    return btoa(String.fromCharCode(...arr)).replace(/[+/=]/g, '').slice(0, 22);
  },
};

/* ─── Curriculum ────────────────────────────────────────────── */
const SCHOOLS = [
  { n:1, name:'SEO & Search',                    pillar:'Search Fundamentals' },
  { n:2, name:'AI Search',                       pillar:'AI Search' },
  { n:3, name:'AEO',                             pillar:'AI Search' },
  { n:4, name:'GEO',                             pillar:'AI Search' },
  { n:5, name:'LLM Visibility',                  pillar:'AI Search' },
  { n:6, name:'AI-ZMOT',                         pillar:'Buyer Behavior' },
  { n:7, name:'Semantic Web & Knowledge Graphs', pillar:'Semantics' },
  { n:8, name:'Structured Data',                 pillar:'Semantics' },
  { n:9, name:'AI Retrieval',                    pillar:'AI Systems' },
  { n:10, name:'AI Content Engineering',         pillar:'Content' },
  { n:11, name:'Digital PR',                     pillar:'Authority' },
  { n:12, name:'AI Advertising',                 pillar:'Advertising' },
  { n:13, name:'Analytics & Measurement',        pillar:'Measurement' },
  { n:14, name:'AI Engineering',                 pillar:'AI Systems' },
  { n:15, name:'AI Agents & Automation',         pillar:'AI Systems' },
  { n:16, name:'CRM & RevOps',                   pillar:'Revenue' },
  { n:17, name:'AI SEO Sales',                   pillar:'Sales' },
  { n:18, name:'Enterprise Sales',               pillar:'Sales' },
  { n:19, name:'Business Acumen',                pillar:'Business' },
  { n:20, name:'Prospect Research',              pillar:'Sales' },
  { n:21, name:'AI Consulting',                  pillar:'Delivery' },
  { n:22, name:'AI SEO Ops',                     pillar:'Delivery' },
  { n:23, name:'AI Leadership',                  pillar:'Leadership' },
  { n:24, name:'AI Ethics & Governance',         pillar:'Governance' },
  { n:25, name:'Digital Identity',               pillar:'Trust' },
  { n:26, name:'Cryptographic Verification',     pillar:'Trust' },
  { n:27, name:'Verifiable Credentials',         pillar:'Trust' },
  { n:28, name:'Blockchain & Proof',             pillar:'Trust' },
  { n:29, name:'Career Development',             pillar:'Career' },
  { n:30, name:'Industry Tools',                 pillar:'Tools' },
];

// ─── Visibility store keys ────────────────────────────────────
Store.visibility = (userId) => {
  Store.data.visibility ||= {};
  Store.data.visibility[userId] ||= [];
  return Store.data.visibility[userId];
};
Store.getGeminiKey = () => localStorage.getItem('aeo9.geminiKey') || '';
Store.setGeminiKey = (k) => localStorage.setItem('aeo9.geminiKey', k.trim());

// Seeded courses with real lesson content — expand by adding objects here
const COURSES = [
  {
    slug:'seo-foundations', title:'SEO Foundations', school:1, level:1, theme:'SEO & Search',
    modules: [
      { title:'What SEO Actually Is', lessons:[
        { id:'sf-1-1', title:'Search engines as retrieval systems', content:
`A search engine is a retrieval system. It crawls pages, indexes them, and ranks candidates by relevance signals. Nothing more mystical than that.

Your job as a professional is to make a page findable, parseable, and worth ranking. Every technique in this curriculum is downstream of that sentence.` },
        { id:'sf-1-2', title:'Intent is the unit of work', content:
`Keywords are not the unit of work. Intent is.

A keyword like "best CRM for agencies" encodes: comparative research, agency context, decision-stage buyer. The page that wins is the one that satisfies that intent — not the one that repeats the phrase most often.` },
        { id:'sf-1-3', title:'Crawl, index, rank — the three gates', content:
`Every SEO problem is one of three failures:

1. The crawler can't reach the page.
2. The indexer doesn't understand what the page is about.
3. The ranker doesn't consider it the best answer.

Diagnose in that order. Fixing rank before crawl is wasted work.` },
      ]},
      { title:'Reading a SERP Like a Professional', lessons:[
        { id:'sf-2-1', title:'SERP features as intent signals', content:
`Google doesn't just rank pages. It interprets intent and constructs a result page around it.

When you see AI Overviews, People Also Ask, local packs, or video carousels in a SERP, Google is telling you exactly what intent it thinks the query carries. Read it. That's the brief.` },
        { id:'sf-2-2', title:'AI Overviews — what they change', content:
`An AI Overview is a synthesized answer. It cites sources. It sits above the organic results.

For professionals, this changes two things: how often your page is cited (not just ranked), and what format wins (extractable, structured, evidence-backed answers).

This is where AEO begins.` },
      ]},
    ],
  },
  {
    slug:'ai-search-foundations', title:'AI Search Foundations', school:2, level:1, theme:'AI Search',
    modules: [
      { title:'From Ranked Lists to Synthesized Answers', lessons:[
        { id:'asf-1-1', title:'What changed', content:
`Traditional search returns ten ranked links. AI search returns one synthesized answer with citations.

The unit of competition shifts: it's no longer "can I be on page one," but "am I mentioned, and am I cited, in the answer the AI produces."` },
        { id:'asf-1-2', title:'Mentions vs citations', content:
`A mention is your brand named in the answer text.
A citation is a source URL surfaced by the AI as evidence for the answer.

They are different, and they require different work.

A mention without a citation means the AI knows your brand but is sourcing its answer elsewhere — different remediation than simply being absent.` },
        { id:'asf-1-3', title:'Observation is the only evidence', content:
`You cannot fabricate visibility. If you want to know whether a brand is cited by AI Overviews for a given prompt, you have to run the prompt, at a specific time, on a specific platform, and record what you saw.

Everything else is guessing dressed as expertise.` },
      ]},
      { title:'AEO in Practice', lessons:[
        { id:'asf-2-1', title:'Extractable answers win', content:
`AI systems retrieve passages, not pages. A page that buries the answer beneath three paragraphs of preamble loses to a page that opens with it.

Write so that any given paragraph could be lifted cleanly into an answer and still make sense.` },
        { id:'asf-2-2', title:'Entities, not keywords', content:
`AI search is entity-aware. It knows that "Apple" the company and "apple" the fruit are different, and it knows which one your query means.

To be found, you have to be a recognized entity with clear relationships to other entities — not just a page that mentions words.` },
      ]},
    ],
  },
  {
    slug:'ai-seo-sales', title:'AI SEO Sales', school:17, level:1, theme:'AI SEO Sales',
    modules: [
      { title:'The Framework', lessons:[
        { id:'sales-1-1', title:'Research → Hypothesis → Permission → Discovery', content:
`Every good sales conversation starts before the call.

Research the prospect using only public information. Form a specific hypothesis about what's likely true. Ask permission to share it. Use it to open discovery.

Skipping research produces generic calls. Skipping the hypothesis produces interrogations. Skipping permission produces resistance.` },
        { id:'sales-1-2', title:'Evidence beats assertion', content:
`"Your competitor outranks you in AI search" is an assertion. It sounds like expertise. It's also the kind of claim that ends a call when the buyer asks "how do you know?"

"In our observed test on [date] across [platform], your competitor appeared in 7 of 10 prompts. You appeared in 1. Here are the prompts and the raw answers" is evidence. It survives interrogation.

Only make the second kind of claim.` },
        { id:'sales-1-3', title:'The Claim Firewall', content:
`Before you make a claim about AI visibility, have four things ready:

1. The platform you observed.
2. The prompt you ran.
3. The date you ran it.
4. What you actually saw.

const OBJECTION_TRIGGERS = [
  { keys:['guarantee','guaranteed','definitely will','will rank'], objection:'careful_claim' },
  { keys:['rank','ranking','outrank','number one','#1'], objection:'careful_claim' },
  { keys:['competitor','competing','outrank'], objection:'evidence' },
  { keys:['roi','revenue','return','roas'], objection:'roi' },
  { keys:['we already','our agency','existing vendor','current seo'], objection:'existing' },
  { keys:['how much','price','cost','budget'], objection:'price' },
  { keys:['busy','later','next week','email me','send me'], objection:'timing' },
];

const BUYER_PROBES = {
  evidence:['What platform did you observe?', 'What were the exact prompts?', 'When did you run the test?'],
  roi:['What\'s the assumption behind that number?', 'What would have to be true for that to work?'],
  existing:['What would you do that our current agency doesn\'t?'],
  price:['Is that monthly or one-time?', 'What\'s included?'],
  timing:['What specifically would you send me?'],
  careful_claim:['Careful — I hear that from every vendor.'],
  discovery_question:['That\'s a fair question. What do you need to know?'],
  closing_attempt:['That\'s a reasonable next step.'],
  fallback:['Go on.', 'Okay.', 'Hmm.', 'What else?', 'Tell me more.'],
};

function buyerRespond(learnerText, persona, difficulty) {
  const t = learnerText.toLowerCase();
  const p = PERSONAS[persona] || PERSONAS.marketing_director;

  // Is it a question? Reward discovery.
  const isQuestion = /\?/.test(learnerText) && (t.startsWith('what')||t.startsWith('how')||t.startsWith('when')||t.startsWith('why')||t.startsWith('who')||t.startsWith('can you')||t.startsWith('would you')||t.startsWith('could you'));

  // Does it contain an unsupported claim?
  const hasEvidenceClaim = /(observed|we ran|tested|on \w+ \d+|platform|prompt|screenshot|measured)/.test(t);
  const hasBareClaim = /(outrank|cited|cited more|appearing|visible|rank higher|beating)/.test(t) && !hasEvidenceClaim;

  // Find objection triggers
  let objectionKey = null;
  for (const trig of OBJECTION_TRIGGERS) {
    if (trig.keys.some(k => t.includes(k))) { objectionKey = trig.objection; break; }
  }

  // Priority order:
  // 1. Bare claim without evidence → demand evidence
  if (hasBareClaim && difficulty >= 2) {
    return pickOne(p.resistance.evidence);
  }
  // 2. Explicit objection
  if (objectionKey && p.resistance[objectionKey]) {
    return pickOne(p.resistance[objectionKey]);
  }
  // 3. Discovery question → reward
  if (isQuestion) {
    return pickOne(['That\'s a good question. ', 'Fair. ']) + pickOne(BUYER_PROBES.discovery_question);
  }
  // 4. Closing signal
  if (/(next step|schedule|calendar|send you|walk you through|proposal|deck)/.test(t)) {
    return pickOne(BUYER_PROBES.closing_attempt);
  }
  // 5. Fallback
  return pickOne(BUYER_PROBES.fallback);
}

function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let toastTimer = null;
function toast(msg, dur = 2400) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

const Router = {
  current: 'dashboard',
  params: {},

  go(path, params = {}) {
    const [route, ...rest] = path.replace(/^#\/?/, '').split('/');
    this.current = route || 'dashboard';
    this.params = { segments: rest, ...params };
    location.hash = '#/' + this.current + (rest.length ? '/' + rest.join('/') : '');
    render();
    window.scrollTo(0, 0);
  },

  parse() {
    const raw = location.hash.replace(/^#\/?/, '');
    const [route, ...rest] = raw.split('/');
    this.current = route || (Store.user() ? 'dashboard' : 'landing');
    this.params = { segments: rest };
  },
};

Views.attempt = () => {

  if (!raw) { Router.go('assessments'); return ''; }
  const state = JSON.parse(raw);
  if (state.assessmentSlug !== slug) { Router.go('assessments'); return ''; }

  const qs = a.questions.map((q, i) => {
    const resp = state.responses[q.id] || {};
    let body = '';
    if (q.type === 'mcq' || q.type === 'multi') {
      body = q.options.map(o => {
        const selected = (resp.selected || []).includes(o.id);
        return `
          <label class="choice ${selected ? 'selected' : ''}" onclick="setAttemptResponse('${q.id}','${o.id}','${q.type}')">
            <input type="${q.type === 'mcq' ? 'radio' : 'checkbox'}" ${selected ? 'checked' : ''} onclick="event.preventDefault()">
            <span>${esc(o.text)}</span>
          </label>
        `;
      }).join('');
    } else {
      body = `<textarea rows="7" placeholder="Write your response..." oninput="setWrittenResponse('${q.id}', this.value)">${esc(resp.text || '')}</textarea>`;
    }
    return `
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
          <span class="eyebrow">Q${i + 1} · ${q.type === 'written' ? 'Written' : q.type === 'multi' ? 'Select all' : 'Select one'}</span>
          <span class="eyebrow">${q.pts} pt${q.pts > 1 ? 's' : ''}</span>
        </div>
        <p style="white-space:pre-wrap;margin-bottom:14px;font-size:14px">${esc(q.prompt)}</p>

      </div>
    `;
  }).join('');

  return `

    <div style="margin-top:24px">${qs}</div>
    <button class="btn btn-primary btn-lg" style="margin-top:12px" onclick="submitAttempt('${a.slug}')">Submit for grading</button>
  `;
};

function setAttemptResponse(qid, oid, type) {
  const state = JSON.parse(sessionStorage.getItem('aeo9.attempt'));
  const resp = state.responses[qid] || { selected: [] };
  if (type === 'mcq') resp.selected = [oid];
  else {
    const set = new Set(resp.selected || []);
    if (set.has(oid)) set.delete(oid); else set.add(oid);
    resp.selected = [...set];
  }
  state.responses[qid] = resp;
  sessionStorage.setItem('aeo9.attempt', JSON.stringify(state));
  render();
}

function setWrittenResponse(qid, text) {
  const state = JSON.parse(sessionStorage.getItem('aeo9.attempt'));
  state.responses[qid] = { text };
  sessionStorage.setItem('aeo9.attempt', JSON.stringify(state));
}

async function submitAttempt(slug) {
  const user = Store.user();
  const a = ASSESSMENTS.find(x => x.slug === slug);
  const state = JSON.parse(sessionStorage.getItem('aeo9.attempt'));
  if (!a || !state) return;

  let earned = 0, total = 0;
  const graded = [];

  for (const q of a.questions) {
    total += q.pts;
    const resp = state.responses[q.id] || {};
    let pts = 0, feedback = '';

    if (q.type === 'mcq' || q.type === 'multi') {
      const sel = resp.selected || [];
      const correct = q.correct || [];
      const isCorrect = sel.length === correct.length && sel.every(s => correct.includes(s));
      pts = isCorrect ? q.pts : 0;
      feedback = isCorrect ? 'Correct.' : 'Not quite.';
    } else {
      const text = (resp.text || '').toLowerCase();
      if (!text || text.length < 20) { pts = 0; feedback = 'Response too short to grade.'; }
      else {
        // Simple heuristic grading based on keyword/anti-keyword presence
        const kwHits = (q.keywords || []).filter(k => text.includes(k)).length;
        const antiHits = (q.antiKeywords || []).filter(k => text.includes(k)).length;
        const kwRatio = (q.keywords || []).length ? kwHits / q.keywords.length : 0;
        let base = Math.round(kwRatio * q.pts);
        base = Math.max(0, base - antiHits * 3);
        pts = Math.min(q.pts, base);
        feedback = `Covered ${kwHits}/${(q.keywords||[]).length} rubric points.${antiHits ? ' Fabricated-statistic language detected.' : ''}`;
      }
    }
    earned += pts;
    graded.push({ questionId: q.id, points: pts, maxPoints: q.pts, feedback, response: resp });
  }

  const scorePct = total ? Math.round((earned / total) * 100) : 0;
  const passed = scorePct >= a.passing;

  const attempt = {
    id: Store.uid(),
    assessmentSlug: slug,
    userId: user.id,
    score: scorePct,
    passed,
    submittedAt: Date.now(),
    responses: graded,
  };
  Store.attempts(user.id).push(attempt);
  Store.save();

  // Issue credential if passed
  if (passed) await issueCredential(user.id, a, attempt);

  sessionStorage.removeItem('aeo9.attempt');
  Router.go('result/' + attempt.id);
}

async function issueCredential(userId, assessment, attempt) {
  const credentialId = 'c_' + Store.uid();
  const verifyToken = Crypto.randomToken(16);
  const issuedAt = new Date().toISOString();

  const payload = {
    '@context': 'https://aeo9.local/credentials/v1',
    id: 'urn:aeo9:credential:' + credentialId,
    issuer: 'AEO 9 · Corporate Curators',
    holder: { id: 'urn:aeo9:user:' + userId },
    level: assessment.level,
    title: assessment.title,
    issuedAt,
    evidence: { assessmentSlug: assessment.slug, score: attempt.score },
  };

  const canonical = Crypto.canonicalize(payload);
  const digestSha256 = await Crypto.sha256(canonical);

  Store.data.credentials.push({
    id: credentialId,
    userId,
    level: assessment.level,
    title: assessment.title,
    issuedAt,
    payload,
    digestSha256,
    verifyToken,
    status: 'ACTIVE',
    attemptId: attempt.id,
    evidence: payload.evidence,
  });
  Store.save();
}

/* ─── Skill Passport ────────────────────────────────────────
   Aggregates data that already exists elsewhere in the app.
   Nothing here is a new measurement — it's a computed summary
   of credentials, evidence, voice scores, and visibility runs
   you already earned or recorded. The skill-level rule is shown
   verbatim so the label is checkable, not asserted. ──────── */
const SKILL_LEVELS = [
  { id:'FOUNDATION',   label:'Foundation',   rule:(s) => true },
  { id:'PRACTITIONER', label:'Practitioner', rule:(s) => s.credentials >= 1 && s.evidenceTotal >= 1 },
  { id:'PROFESSIONAL', label:'Professional', rule:(s) => s.credentials >= 2 && s.evidenceVerifiedOrObserved >= 1 && s.voiceScored >= 1 },
  { id:'SPECIALIST',   label:'Specialist',   rule:(s) => s.credentials >= 4 && s.voiceAvg !== null && s.voiceAvg >= 70 },
  { id:'ADVANCED',     label:'Advanced',     rule:(s) => s.credentials >= 6 && s.voiceAvg !== null && s.voiceAvg >= 80 && s.evidenceVerifiedOrObserved >= 3 },
];

function computeSkillLevel(stats) {
  let current = SKILL_LEVELS[0];
  for (const lvl of SKILL_LEVELS) if (lvl.rule(stats)) current = lvl;
  return current;
}

Views.passport = () => {
  const user = Store.user();
  if (!user) return Views.landing();

  const creds = Store.data.credentials.filter(c => c.userId === user.id);

  const evidenceByStatus = evidence.reduce((acc, e) => { acc[e.status] = (acc[e.status] || 0) + 1; return acc; }, {});
  const voiceSessions = Store.data.voiceSessions.filter(v => v.userId === user.id && v.score);
  const voiceAvg = voiceSessions.length ? Math.round(voiceSessions.reduce((n, v) => n + v.score.overall, 0) / voiceSessions.length) : null;
  const visRuns = Store.visibility(user.id);
  const prospects = Store.prospects(user.id);
  const progress = Store.progress(user.id);

  const stats = {
    credentials: creds.length,

    evidenceVerifiedOrObserved: (evidenceByStatus.VERIFIED || 0) + (evidenceByStatus.OBSERVED || 0),
    voiceScored: voiceSessions.length,
    voiceAvg,
  };
  const level = computeSkillLevel(stats);
  const levelIndex = SKILL_LEVELS.findIndex(l => l.id === level.id);

  return `
    <h1>AEO 9 Skill Passport</h1>
    <p class="sub">A computed summary of what's already recorded elsewhere in this app — not a new score.</p>

    <div class="card" style="margin-top:24px;border-color:var(--gold-dim);background:rgba(212,175,55,.05)">

        ${SKILL_LEVELS.map((l, i) => `<div style="flex:1;height:4px;border-radius:2px;background:${i <= levelIndex ? 'var(--gold)' : 'var(--obsidian-100)'}"></div>`).join('')}
      </div>
      <p style="margin-top:14px;font-size:11px;color:var(--text-mute);line-height:1.6">
        Rule for "${esc(level.label)}": ${level.id === 'FOUNDATION' ? 'default starting level.' : ''}
        ${level.id === 'PRACTITIONER' ? '≥1 credential and ≥1 evidence card.' : ''}
        ${level.id === 'PROFESSIONAL' ? '≥2 credentials, ≥1 VERIFIED/OBSERVED evidence card, ≥1 scored voice session.' : ''}
        ${level.id === 'SPECIALIST' ? '≥4 credentials and average voice score ≥70.' : ''}
        ${level.id === 'ADVANCED' ? '≥6 credentials, average voice score ≥80, ≥3 VERIFIED/OBSERVED evidence cards.' : ''}
      </p>
    </div>

    <div class="grid grid-3" style="margin-top:24px">
      <div class="stat">
        <div class="stat-label">Credentials</div>
        <div class="stat-value">${creds.length}</div>
        <div class="stat-sub">of ${LADDER.length} on the ladder</div>
      </div>
      <div class="stat">
        <div class="stat-label">Evidence cards</div>
        <div class="stat-value">${evidence.length}</div>
        <div class="stat-sub">${stats.evidenceVerifiedOrObserved} VERIFIED/OBSERVED</div>
      </div>
      <div class="stat">
        <div class="stat-label">Voice avg</div>
        <div class="stat-value">${voiceAvg !== null ? voiceAvg : '—'}</div>
        <div class="stat-sub">${voiceSessions.length} scored session${voiceSessions.length === 1 ? '' : 's'}</div>
      </div>
      <div class="stat">

      <div class="stat">
        <div class="stat-label">Visibility runs</div>
        <div class="stat-value">${visRuns.length}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Prospects researched</div>
        <div class="stat-value">${prospects.length}</div>
      </div>
    </div>

    <div class="section-head" style="margin-top:32px"><h2>Credentials on this passport</h2></div>
    ${creds.length === 0 ? `<div class="empty">No credentials yet. <a href="#/credentials">View the ladder.</a></div>` : `
      <div class="list">
        ${creds.map(c => `
          <div class="list-item" onclick="Router.go('verify/${c.verifyToken}')">

function startVoiceCall(scenario) {
  const user = Store.user();
  const session = {

  const turns = session.turns.map(t => `

const Voice = { active: null, recognition: null, synth: null, listening: false, speaking: false, thinking: false, startTime: 0 };

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showTypeFallback(); return; }

  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  Voice.recognition = rec;
  Voice.listening = true;
  Voice.finalText = '';

  rec.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) Voice.finalText += final;
    // Live preview via toast
    if (interim || final) toast(Voice.finalText + interim, 100000);
  };

  rec.onerror = (e) => {
    Voice.listening = false;
    toast('Microphone error: ' + e.error);
    render();
  };

  rec.onend = () => {
    Voice.listening = false;
    clearTimeout(toastTimer);
    const text = Voice.finalText.trim();
    if (text) handleLearnerTurn(text);
    else { toast('No speech detected.'); render(); }
  };

  try { rec.start(); render(); }
  catch (e) { Voice.listening = false; toast('Could not start microphone.'); render(); }
}

function stopListening() {
  if (Voice.recognition) { try { Voice.recognition.stop(); } catch {} }
}

function interruptBuyer() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  Voice.speaking = false;
  render();
}

function showTypeFallback() {
  const el = document.getElementById('type-fallback');
  el.style.display = 'block';
  document.getElementById('type-input').focus();
}

function sendTyped() {
  const input = document.getElementById('type-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('type-fallback').style.display = 'none';
  handleLearnerTurn(text);
}

function handleLearnerTurn(text) {
  const session = Voice.active;
  if (!session) return;
  session.turns.push({ who: 'learner', text, at: Date.now() });
  Voice.thinking = true;
  render();

  // Simulate thinking delay
  setTimeout(() => {
    const buyerText = buyerRespond(text, session.persona, session.difficulty);
    session.turns.push({ who: 'buyer', text: buyerText, at: Date.now() });
    Voice.thinking = false;
    Store.save();
    speakBuyer(session, buyerText);
  }, 600 + Math.random() * 600);
}

function speakBuyer(session, text) {
  Voice.speaking = true;
  render();

  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.0;
  u.pitch = 1.0;
  u.lang = 'en-US';
  // Pick a voice if one is available
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /en-US/i.test(v.lang) && /female|samantha|zira|google us/i.test(v.name)) || voices.find(v => /en-US/i.test(v.lang));
  if (preferred) u.voice = preferred;

  u.onend = () => {
    Voice.speaking = false;
    render();
  };
  u.onerror = () => {
    Voice.speaking = false;
    render();
  };

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function endVoiceCall() {
  const session = Voice.active;
  if (!session) return;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  session.endedAt = Date.now();
  const seconds = Math.round((session.endedAt - session.startedAt) / 1000);
  Store.usage(session.userId).push({ kind: 'voice', seconds, at: Date.now() });
  session.score = scoreVoiceSession(session);
  Store.save();
  Voice.active = null;
  Voice.listening = false;
  Voice.speaking = false;
  Voice.thinking = false;
  Router.go('voice-score/' + session.id);
}

function scoreVoiceSession(session) {
  const learner = session.turns.filter(t => t.who === 'learner');
  const buyer = session.turns.filter(t => t.who === 'buyer');
  const all = session.turns.map(t => t.text).join(' ').toLowerCase();

  // Discovery: questions asked
  const questions = learner.filter(t => /\?/.test(t.text)).length;
  const discovery = clamp(questions * 15 + 20);

  // Evidence: mentions of observation words
  const evidenceWords = (all.match(/(observed|we ran|tested|platform|prompt|date|screenshot|measured|specific)/g) || []).length;
  const evidenceUse = clamp(evidenceWords * 12);

  // Objection handling: buyer turns that were objections, followed by learner engagement
  const objections = buyer.filter(t => /(how do you know|prove|already have|doesn't matter|too expensive|not a good time|send me)/i.test(t.text)).length;
  const engagements = learner.length;
  const objectionHandling = clamp(objections ? Math.min(100, (engagements / Math.max(1, objections)) * 40) : 50);

  // Closing: next step language
  const closingMoves = (all.match(/(next step|schedule|calendar|proposal|send you|walk you through|deck)/g) || []).length;
  const closing = clamp(closingMoves * 30);

  // Unsupported claims
  const unsupported = [];
  for (const t of learner) {
    const lower = t.text.toLowerCase();
    if (/(outrank|cited more|rank higher|dominat)/.test(lower) && !/(observed|we ran|tested|platform|prompt|on \w+ \d+)/.test(lower)) {
      unsupported.push({ quote: t.text.slice(0, 140), reason: 'Claim about AI visibility or ranking without observation evidence (platform, prompt, date).' });
    }
    if (/(guarantee|guaranteed|100%|definitely will)/.test(lower)) {
      unsupported.push({ quote: t.text.slice(0, 140), reason: 'Absolute guarantee language.' });
    }
  }

  const overall = Math.round((discovery + evidenceUse + objectionHandling + closing) / 4);

  const strengths = [];
  const weaknesses = [];
  if (discovery >= 60) strengths.push('Asked meaningful discovery questions.');
  else weaknesses.push('Not enough discovery. Ask more open questions.');
  if (evidenceUse >= 40) strengths.push('Referenced observation-based evidence.');
  else weaknesses.push('Rarely referenced specific observations. Practice using platform + prompt + date framing.');
  if (objectionHandling >= 60) strengths.push('Engaged with objections rather than deflecting.');
  else weaknesses.push('Struggled to convert objections into information.');
  if (closing >= 30) strengths.push('Attempted a next step.');
  else weaknesses.push('Did not propose a clear next step.');

  return {
    overall,
    dimensions: { discovery, evidenceUse, objectionHandling, closing },
    strengths,
    weaknesses,
    unsupportedClaims: unsupported,
    learnerTurns: learner.length,
    buyerTurns: buyer.length,
  };
}

function clamp(n) { return Math.max(0, Math.min(100, Math.round(n))); }

/* ─── Helpers ───────────────────────────────────────────────── */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ─── AI Visibility Lab + AI-ZMOT ─────────────────────────────
   Works in three modes, labeled honestly:
     • api_direct     — you provided a Gemini API key
     • manual_entry   — you recorded what you observed in a platform's UI
     • simulated      — no observation; output is a hypothesis only
   Every observation carries its platform, method, date, and status.
   No result is displayed without them. ─────────────────────── */

/* ─── Provider adapters ─────────────────────────────────────── */
const Providers = {
  async geminiDirect(prompt) {
    const key = Store.getGeminiKey();
    if (!key) throw new Error('no_key');
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.2 },
        }),
      }
    );
    if (!res.ok) throw new Error('gemini_' + res.status);
    const data = await res.json();
    const c = data?.candidates?.[0];
    const answer = (c?.content?.parts || []).map(p => p.text).filter(Boolean).join('\n');
    const cited = (c?.groundingMetadata?.groundingChunks || []).map(x => x?.web?.uri).filter(Boolean);
    return { answer, cited, status: 'OBSERVED', confidence: cited.length ? 90 : 60 };
  },
};

/* ─── Extraction (crude, honest about its limits) ───────────── */
function extractBrands(text) {
  if (!text) return [];
  const stop = new Set(['The','This','That','These','Those','Some','Many','Most','However','But','And','One','Two','Three','Yes','No','In','On','For','With']);
  const out = [];
  const seen = new Set();
  const matches = text.match(/\b([A-Z][a-zA-Z0-9]+(?:\s+[A-Z][a-zA-Z0-9]+){0,3})\b/g) || [];
  matches.forEach((m, i) => {
    if (stop.has(m) || seen.has(m)) return;
    seen.add(m);
    out.push({ name: m, position: i, sentiment: 'neutral' });
  });
  return out;
}

/* ─── Scoring (computed, not invented) ──────────────────────── */
function computeMetrics(obs) {
  if (!obs.length) return { visibility: 0, share: 0, citation: 0, observed: 0, total: 0, confidence: 0 };
  const observed = obs.filter(o => o.status === 'OBSERVED' || o.status === 'VERIFIED');
  if (!observed.length) return { visibility: 0, share: 0, citation: 0, observed: 0, total: obs.length, confidence: 0 };

  const mentions = observed.filter(o => o.brandMentioned).length;
  const citations = observed.filter(o => o.brandCited).length;
  const slots = observed.reduce((n, o) => n + Math.max(1, (o.citedUrls || []).length || 1), 0);

  const posScore = observed.reduce((sum, o) => {
    if (!o.brandMentioned) return sum;
    return sum + Math.max(0, 100 - (o.brandPosition ?? 10) * 10);
  }, 0);

  const visibility = Math.round(posScore / observed.length);
  const share = Math.round((mentions / observed.length) * 100);
  const citation = slots ? Math.round((citations / slots) * 100) : 0;
  const minConf = Math.min(...observed.map(o => o.confidence || 0));
  const confidence = Math.round(minConf * (observed.length / obs.length));

  return { visibility, share, citation, observed: observed.length, total: obs.length, confidence };
}

function computeZmot(observations) {
  const m = computeMetrics(observations);
  const stages = {
    discovery:     clamp(m.visibility),
    research:      clamp(Math.round((m.share + m.confidence) / 2)),
    comparison:    clamp(m.share),
    validation:    clamp(m.citation),
    shortlisting:  clamp(Math.round(m.visibility * 0.7 + m.citation * 0.3)),
    action:        clamp(Math.round(m.citation * 0.5 + m.confidence * 0.5)),
  };
  const overall = Math.round(Object.values(stages).reduce((a, b) => a + b, 0) / 6);

  const unknownCount = observations.filter(o => o.status === 'UNKNOWN').length;
  const platforms = [...new Set(observations.map(o => o.platform))].join(', ');
  const methods = [...new Set(observations.map(o => o.method))].join(', ');

  return {
    stages, overall,
    limitations: `Based on ${observations.length} observation(s) across ${platforms || 'no platform'}. Methods: ${methods || 'none'}.` +
      (unknownCount ? ` ${unknownCount} observation(s) excluded as UNKNOWN.` : '') +
      ` Scores reflect observed data only. Where observations are absent or UNKNOWN, scores reflect that absence — not the brand's true visibility.`,
  };
}

async function runVisibility() {
  const user = Store.user();
  const brand = document.getElementById('v-brand').value.trim();
  const comps = document.getElementById('v-comps').value.split(',').map(s => s.trim()).filter(Boolean);
  const platform = document.getElementById('v-platform').value;
  const promptText = document.getElementById('v-prompts').value;
  const prompts = promptText.split('\n').map(s => s.trim()).filter(Boolean);

  if (!brand) { toast('Brand required.'); return; }
  if (!prompts.length) { toast('At least one prompt required.'); return; }
  if (prompts.length > 20) { toast('Max 20 prompts per run.'); return; }

  const isManual = platform !== 'gemini';
  const manualAnswers = isManual
    ? (document.getElementById('v-answers').value || '').split(/\n---+\n/).map(s => s.trim())
    : [];
  const manualCited = isManual
    ? (document.getElementById('v-cited').value || '').split('\n').map(s => s.trim()).filter(Boolean)
    : [];

  if (isManual && manualAnswers.filter(Boolean).length !== prompts.length) {
    toast('Manual runs need one recorded answer per prompt (separated by ---).');
    return;
  }

  const btn = document.getElementById('v-run-btn');
  btn.disabled = true;
  btn.textContent = 'Running…';

  const observations = [];
  const allTargets = [brand, ...comps];

  for (let i = 0; i < prompts.length; i++) {
    const prompt = prompts[i];
    let answer = '', cited = [], status = 'UNKNOWN', confidence = 0, notes = '';

    if (isManual) {
      answer = manualAnswers[i] || '';
      cited = i === 0 ? manualCited : [];
      status = answer ? 'OBSERVED' : 'UNKNOWN';
      confidence = answer ? 95 : 0;
      notes = 'Recorded from platform UI by the learner.';
    } else {
      try {
        const r = await Providers.geminiDirect(prompt);
        answer = r.answer; cited = r.cited; status = r.status; confidence = r.confidence;
      } catch (e) {
        status = 'UNKNOWN'; confidence = 0;
        notes = e.message === 'no_key'
          ? 'No API key configured.'
          : `Observation failed (${e.message}).`;
      }
    }

    const mentions = extractBrands(answer);
    const brandHit = mentions.find(m => m.name.toLowerCase().includes(brand.toLowerCase()));
    const brandCited = cited.some(u => u.toLowerCase().includes(brand.toLowerCase().replace(/\s+/g, '')));

    observations.push({
      id: Store.uid(),
      prompt, answer, citedUrls: cited,
      mentionedBrands: mentions,
      brandMentioned: !!brandHit,
      brandCited: !!brandHit && brandCited,
      brandPosition: brandHit?.position ?? null,
      status, confidence, notes,
      observedAt: Date.now(),
    });
  }

  const run = {
    id: Store.uid(),
    userId: user.id,
    brand, competitors: comps,
    platform,
    method: platform === 'gemini' ? 'api_direct' : 'manual_entry',
    prompts,
    observations,
    runAt: Date.now(),
  };

  Store.visibility(user.id).push(run);
  Store.save();
  Router.go('visibility-run/' + run.id);
}

Views['visibility-run'] = () => {
  const user = Store.user();
  if (!user) return Views.landing();
  const id = Router.params.segments[0];
  const run = Store.visibility(user.id).find(r => r.id === id);
  if (!run) return `<p>Run not found.</p>`;

  const m = computeMetrics(run.observations);
  const zmot = computeZmot(run.observations);

  return `
    <a href="#/visibility" style="font-size:12px;color:var(--text-mute)">← Visibility Lab</a>
    <h1 style="margin-top:16px">${esc(run.brand)}</h1>
    <p class="sub">
      ${esc(run.platform)} · ${esc(run.method)} · ${new Date(run.runAt).toLocaleString()}
    </p>

    <div class="grid grid-3" style="margin-top:24px">
      <div class="stat">
        <div class="stat-label">AI Visibility</div>
        <div class="stat-value">${m.visibility}</div>
        <div class="stat-sub">${m.observed}/${m.total} observed</div>
      </div>
      <div class="stat">
        <div class="stat-label">Share of Voice</div>
        <div class="stat-value">${m.share}%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Citation Share</div>
        <div class="stat-value">${m.citation}%</div>
      </div>
    </div>

    ${m.observed < m.total ? `
      <div class="alert alert-warn" style="margin-top:20px;font-size:12px">
        ${m.total - m.observed} observation(s) are UNKNOWN and excluded from scoring. Add an API key or record what you observed.
      </div>
    ` : ''}

    <div class="section-head" style="margin-top:32px"><h2>AI-ZMOT</h2></div>
    <div class="card" style="border-color:var(--gold-dim);background:rgba(212,175,55,.04)">
      <div style="display:flex;align-items:baseline;gap:12px">
        <span style="font-size:48px;font-weight:300;color:var(--gold)">${zmot.overall}</span>
        <span class="eyebrow">overall</span>
      </div>
      <div class="grid grid-3" style="margin-top:20px;gap:12px">
        ${Object.entries(zmot.stages).map(([stage, v]) => `
          <div>
            <div class="eyebrow">${stage}</div>
            <div style="font-size:20px;color:var(--gold);font-weight:300;margin-top:2px">${v}</div>
            <div class="progress" style="margin-top:6px"><div class="progress-bar" style="width:${v}%"></div></div>
          </div>
        `).join('')}
      </div>
      <p style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--text-mute);line-height:1.6">
        ${esc(zmot.limitations)}
      </p>
    </div>

    <div class="section-head" style="margin-top:32px"><h2>Observations</h2></div>
    <div class="list">
      ${run.observations.map(o => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
            <p style="flex:1;font-size:13px;color:var(--text-dim)"><strong style="color:var(--text)">Prompt:</strong> ${esc(o.prompt)}</p>
            <span class="tag tag-${o.status}">${o.status}</span>
          </div>
          ${o.answer ? `
            <details style="margin-top:12px">
              <summary style="cursor:pointer;font-size:12px;color:var(--gold)">Show answer</summary>
              <pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--text-dim);margin-top:10px;padding:12px;background:var(--obsidian-100);border-radius:6px">${esc(o.answer)}</pre>
            </details>
          ` : ''}
          <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text-mute)">
            <span>Brand mentioned: <strong style="color:${o.brandMentioned ? 'var(--green)' : 'var(--text-mute)'}">${o.brandMentioned ? 'yes' : 'no'}</strong></span>
            <span>Brand cited: <strong style="color:${o.brandCited ? 'var(--green)' : 'var(--text-mute)'}">${o.brandCited ? 'yes' : 'no'}</strong></span>
            ${o.brandPosition != null ? `<span>Position: ${o.brandPosition}</span>` : ''}
            <span>Confidence: ${o.confidence}%</span>
          </div>
          ${o.citedUrls.length ? `
            <div style="margin-top:10px">
              <p class="eyebrow">Cited URLs</p>
              <ul style="list-style:none;margin-top:6px;font-size:11px">
                ${o.citedUrls.slice(0, 8).map(u => `<li style="word-break:break-all;color:var(--text-mute)">${esc(u)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
          ${o.notes ? `<p style="margin-top:10px;font-size:11px;color:var(--amber)">${esc(o.notes)}</p>` : ''}
        </div>
      `).join('')}
    </div>
  `;
};

/* ─── Shell render ──────────────────────────────────────────── */
function render() {
  const user = Store.user();
  const route = Router.current;
  const view = Views[route] || Views.landing;
  const html = view();

  if (!user || route === 'landing' || route === 'login' || route === 'signup' || route === 'verify') {
    document.getElementById('app').innerHTML = html;
    return;
  }

  const NAV_ITEMS = [
    { id:'dashboard', label:'Home' },
    { id:'learn', label:'Learn' },
    { id:'assessments', label:'Assess' },
    { id:'voice', label:'Voice' },
    { id:'prospects', label:'Prospects' },
    { id:'visibility', label:'Visibility' },
    { id:'evidence', label:'Evidence' },
    { id:'credentials', label:'Credentials' },
    { id:'passport', label:'Skill Passport' },
    { id:'certifications', label:'External Certs' },
  ];

  document.getElementById('app').innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brand" onclick="Router.go('dashboard')">
          <div class="brand-sub">Corporate Curators</div>
          <div class="brand-name">AEO 9</div>
          <div class="brand-tag">AI SEO Academy</div>
        </div>
        ${NAV_ITEMS.map(n => `
          <div class="nav-item ${route === n.id || (route === 'course' && n.id === 'learn') || (route === 'lesson' && n.id === 'learn') || (route === 'attempt' && n.id === 'assessments') || (route === 'result' && n.id === 'assessments') || (route === 'voice-score' && n.id === 'voice') || ((route === 'visibility-new' || route === 'visibility-run') && n.id === 'visibility') ? 'active' : ''}"
               onclick="Router.go('${n.id}')">
            <span class="nav-dot"></span>${n.label}
          </div>
        `).join('')}
        <div style="flex:1"></div>
        <div class="nav-item" onclick="Router.go('verify')">
          <span class="nav-dot"></span>Verify
        </div>
        <div class="nav-item" onclick="doLogout()">
          <span class="nav-dot"></span>Sign out
        </div>
        <p style="font-size:10px;color:var(--text-mute);margin-top:14px;padding:0 12px">${esc(user.email)}</p>
      </aside>
      <main class="main">${html}</main>
    </div>
    <nav class="bottom-nav">
      ${['dashboard','learn','assessments','voice','visibility'].map(id => {
        const n = NAV_ITEMS.find(x => x.id === id);
        const active = route === n.id
          || (route === 'course' && n.id === 'learn')
          || (route === 'lesson' && n.id === 'learn')
          || ((route === 'visibility-new' || route === 'visibility-run') && n.id === 'visibility');
        return `
        <div class="nav-item ${active ? 'active' : ''}" onclick="Router.go('${n.id}')">
          <span class="nav-dot"></span>${n.label}
        </div>
      `;
      }).join('')}
    </nav>
  `;
}

/* ─── Boot ──────────────────────────────────────────────────── */
Store.load();
Router.parse();
window.addEventListener('hashchange', () => { Router.parse(); render(); });
render();
