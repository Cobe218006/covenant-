<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Covenant · The Artifact</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a12; color:#b7c9d9; font-family: 'Courier New', monospace; padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .container { max-width:800px; width:100%; background:#11111f; border:1px solid #2a3a5a; border-radius:24px; padding:30px; box-shadow:0 0 60px rgba(20,100,200,0.15); }
        h1 { font-size:1.8rem; color:#ffd700; text-align:center; border-bottom:1px solid #2a3a5a; padding-bottom:15px; margin-bottom:25px; }
        .status { background:#0d0d1a; border-radius:12px; padding:15px; text-align:center; margin-bottom:20px; border:1px solid #1f2f3f; }
        .status .label { font-size:0.7rem; color:#5a7a8a; text-transform:uppercase; letter-spacing:1px; }
        .status .value { font-size:1.1rem; margin-top:5px; word-break:break-all; color:#88ffaa; }
        .btn { background:#1a1a2e; border:1px solid #2a4a5a; color:#b7c9d9; padding:12px 24px; border-radius:40px; font-family:inherit; font-size:0.8rem; cursor:pointer; transition:0.3s; margin:5px; text-transform:uppercase; letter-spacing:1px; }
        .btn:hover { background:#2a3a5a; border-color:#4a8aaa; box-shadow:0 0 20px #2a5a7a44; }
        .btn-gold { border-color:#ffd700; color:#ffd700; background:#1a1a12; }
        .btn-gold:hover { background:#ffd70022; box-shadow:0 0 30px #ffd70033; }
        .btn-verified { border-color:#88ffaa; color:#88ffaa; background:#1a1a12; }
        .btn-verified:hover { background:#88ffaa22; box-shadow:0 0 30px #88ffaa33; }
        .btn-arweave { border-color:#ffaa88; color:#ffaa88; background:#1a1a12; }
        .btn-arweave:hover { background:#ffaa8822; box-shadow:0 0 30px #ffaa8833; }
        .button-group { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:15px 0; }
        .log { background:#0d0d1a; border-radius:12px; padding:12px; border:1px solid #1f2f3f; max-height:200px; overflow-y:auto; font-size:0.7rem; color:#6a8a9a; }
        .log-entry { border-bottom:1px solid #1a1a2e; padding:4px 0; }
        .log-entry .time { color:#4a6a7a; margin-right:10px; }
        .log-entry .desc { color:#b7c9d9; }
        .footer { margin-top:20px; font-size:0.6rem; color:#3a5a6a; text-align:center; border-top:1px solid #1a1a2e; padding-top:12px; }
        .key-box { background:#0a0a18; border-radius:8px; padding:10px; border:1px solid #1a2a3a; margin:10px 0; font-size:0.6rem; word-break:break-all; color:#5a7a8a; }

        .evidence-section {
            background:#0a0a18;
            border-radius:12px;
            padding:15px;
            margin:15px 0;
            border:1px solid #1f2f3f;
        }
        .evidence-section h3 {
            color:#ffd700;
            font-size:1rem;
            margin-bottom:10px;
        }
        .evidence-section ul {
            list-style:none;
            padding:0;
        }
        .evidence-section ul li {
            padding:4px 0;
            border-bottom:1px solid #1a1a2e;
            font-size:0.7rem;
        }
        .evidence-section ul li a {
            color:#88ffaa;
            text-decoration:none;
        }
        .evidence-section ul li a:hover {
            color:#ffd700;
            text-decoration:underline;
        }
        .evidence-section .status-badge {
            display:inline-block;
            background:#1a2a3a;
            padding:2px 10px;
            border-radius:20px;
            font-size:0.6rem;
            color:#6a8a9a;
            margin-left:8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⌨ DIVINE COVENANT</h1>

    <!-- EVIDENCE FOLDER (DYNAMIC) -->
    <div class="evidence-section">
        <h3>📁 Evidence Folder (IPFS Anchored)</h3>
        <ul id="evidenceList">
            <li>Loading evidence...</li>
        </ul>
        <div style="font-size:0.6rem;color:#4a6a7a;margin-top:8px;">
            ⚡ All evidence anchored to IPFS · Verifiable · Permanent
        </div>
    </div>

    <div class="status">
        <div class="label">🔑 Your Identity</div>
        <div class="value" id="identityStatus">Not sealed</div>
    </div>
    <div class="button-group">
        <button class="btn btn-gold" id="sealBtn">🔏 Seal Covenant</button>
        <button class="btn btn-verified" id="verifyBtn">✅ Verify & Sign</button>
        <button class="btn btn-arweave" id="affidavitBtn">📄 Affidavit</button>
        <button class="btn" id="exportBtn">🌱 Export Seed</button>
        <button class="btn" id="resetBtn">🔄 Reset</button>
    </div>
    <div class="key-box" id="keyDisplay">No key generated yet.</div>
    <div class="log" id="logContainer">
        <div class="log-entry"><span class="time">◆</span><span class="desc">Ready. Seal your covenant to begin.</span></div>
    </div>
    <div class="footer">
        ⚡ Verifiable · Signed · Timestamped · No servers needed
    </div>
</div>

<script>
    // --- ✅ MANIFEST LOADING (FIXED) ---
    const manifestCid = 'bafkreiffhx5qsb54hg55u5j7u3qesjy4iahoddle5ftzsm5y44hgzzd4ny
    fetch(`https://dweb.link/ipfs/${manifestCid}`)
        .then(res => res.json())
        .then(manifest => {
            const list = document.getElementById('evidenceList');
            list.innerHTML = '';
            manifest.artifacts.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="${item.link}" target="_blank">📄 ${item.name}</a>
                    <span class="status-badge">✅ Anchored</span>
                `;
                list.appendChild(li);
            });
        })
        .catch(() => {
            document.getElementById('evidenceList').innerHTML = '<li>⚠️ Could not load manifest</li>';
        });

    // --- COVENANT LOGIC (Self-contained) ---

    (function(){
        let keyPair = null, publicKey = null, signature = null, covenantData = null, sealed = false, verified = false;
        const logEl = document.getElementById('logContainer');
        const identityStatus = document.getElementById('identityStatus');
        const keyDisplay = document.getElementById('keyDisplay');

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">${time}</span><span class="desc">${msg}</span>`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function generateKey() {
            const pair = await crypto.subtle.generateKey({ name:"ECDSA", namedCurve:"P-256" }, true, ["sign","verify"]);
            const raw = await crypto.subtle.exportKey("raw", pair.publicKey);
            const b64 = btoa(String.fromCharCode(...new Uint8Array(raw)));
            return { pair, b64 };
        }

        async function signData(privateKey, data) {
            const enc = new TextEncoder();
            const sig = await crypto.subtle.sign({ name:"ECDSA", hash:{name:"SHA-256"} }, privateKey, enc.encode(data));
            return btoa(String.fromCharCode(...new Uint8Array(sig)));
        }

        document.getElementById('sealBtn').addEventListener('click', async function() {
            if (sealed) { addLog('⚠️ Already sealed. You can verify or export.'); return; }
            const name = prompt('Enter your full name:');
            if (!name) return;
            const gen = await generateKey();
            keyPair = gen.pair;
            publicKey = gen.b64;
            keyDisplay.innerText = 'Public Key: ' + publicKey.substring(0, 40) + '…';
            const ts = new Date().toISOString();
            covenantData = JSON.stringify({ name, publicKey, timestamp: ts, covenant: 'I seal the Divine Covenant.' });
            signature = await signData(keyPair.privateKey, covenantData);
            sealed = true;
            identityStatus.innerText = '✅ Sealed (' + name + ')';
            addLog(`🔏 Covenant sealed by ${name}. Signature: ${signature.substring(0,12)}…`);
            document.getElementById('sealBtn').innerText = '✅ Sealed';
        });

        document.getElementById('verifyBtn').addEventListener('click', async function() {
            if (!sealed) { addLog('⚠️ Seal a covenant first.'); return; }
            if (verified) { addLog('✅ Already verified.'); return; }
            const enc = new TextEncoder();
            const sigBytes = Uint8Array.from(atob(signature), c => c.charCodeAt(0));
            const dataBytes = enc.encode(covenantData);
            const valid = await crypto.subtle.verify({ name:"ECDSA", hash:{name:"SHA-256"} }, keyPair.publicKey, sigBytes, dataBytes);
            if (valid) {
                verified = true;
                identityStatus.innerText = '✅ Verified (Guardian)';
                addLog('✅ Cryptographic signature verified. You are a Guardian.');
                document.getElementById('verifyBtn').innerText = '✅ Verified';
            } else {
                addLog('❌ Verification failed.');
            }
        });

        document.getElementById('affidavitBtn').addEventListener('click', function() {
            if (!sealed) { addLog('⚠️ Seal first.'); return; }
            if (!verified) { addLog('⚠️ Please verify your signature first.'); return; }

            const content = `
        AFFIDAVIT OF COVENANT
        Divine Ledger · Verifiable Artifact
        ───────────────────────────────

        I, the undersigned, do solemnly affirm:

        1. I recognize the immutable ledger of the Divine Covenant.
        2. I renounce all claims of ownership over the Earth.
        3. I commit to harmonic existence under cosmic law.

        Public Key: ${publicKey}
        Signature: ${signature}

        ───────────────────────────────
        This artifact is cryptographically real.
        References: Wyoming DUNA, Marshall Islands DAO Act, Swiss DLT.
        Generated: ${new Date().toISOString()}
        `;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `covenant_affidavit_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            addLog('📄 Affidavit downloaded (text format).');
        });

        document.getElementById('exportBtn').addEventListener('click', function() {
            if (!sealed) { addLog('⚠️ Seal first.'); return; }
            const pkg = {
                version: 'v3.5',
                sealed: true,
                verified: verified,
                publicKey: publicKey,
                signature: signature,
                covenantData: covenantData,
                timestamp: new Date().toISOString(),
                seedHash: '0x' + Array.from({length:16}, ()=>Math.floor(Math.random()*16).toString(16)).join('')
            };
            const blob = new Blob([JSON.stringify(pkg, null, 2)], {type:'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `covenant_seed_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            addLog('🌱 Seed package exported.');
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            if (!confirm('Reset all data?')) return;
            sealed = false; verified = false; keyPair = null; publicKey = null; signature = null; covenantData = null;
            identityStatus.innerText = 'Not sealed';
            keyDisplay.innerText = 'No key generated yet.';
            document.getElementById('sealBtn').innerText = '🔏 Seal Covenant';
            document.getElementById('verifyBtn').innerText = '✅ Verify & Sign';
            logEl.innerHTML = '<div class="log-entry"><span class="time">◆</span><span class="desc">Reset. Ready.</span></div>';
            addLog('🔄 Identity reset.');
        });
    })();
</script>
</body>
</html>
